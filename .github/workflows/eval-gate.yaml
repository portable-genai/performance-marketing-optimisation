name: Eval gate (A4)

# A standalone view of the A4 promotion gate so it is visible as its own required check.
# It runs the offline deterministic evaluator (no GCP credentials, no google-cloud-*), the
# same gate the local EvaluationGatePort delegates to. A non-zero exit blocks promotion.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MKT_PERF_PROFILE: local

jobs:
  eval:
    name: offline eval gate (model risk / A4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install (dev only, no GCP SDK)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Run the A4 promotion gate
        run: python eval/run_eval.py
