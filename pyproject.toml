[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "performance-marketing-optimisation"
version = "0.0.1"
description = "D4 Performance Marketing and Attribution — deterministic multi-touch attribution, ROAS/CAC, bid/budget optimisation, A/B significance and anomaly detection over a metrics warehouse, with the LLM narrating results and drafting spend shifts, generic across banking and online retail and the JP/AU/SG markets, built ports-and-adapters on the Gemini Enterprise Agent Platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["performance-marketing-optimisation", "attribution", "roas", "cac", "ab-testing", "anomaly-detection", "gemini", "bigquery", "gcp", "marketing", "apac"]

# Core deps are framework-light so the domain + on-prem/test (local) profile install
# without any Google Cloud SDK. The managed-service adapters live in the [gcp] extra.
dependencies = [
  # Shared commons, pinned by tag; no build-time coupling. Public repos, so CI
  # installs them with zero credentials. hex-service-kit: outbound S2S, fail-closed net defaults,
  # StrEnum base, to_jsonable, hash-chained WORM audit. agent-eval-kit: the Hrz4
  # promotion-gate client the platform eval adapter uses.
  "hex-service-kit @ git+https://github.com/portable-genai/hex-service-kit@v0.0.1",
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  # review-kit: the producer half of rule R8 (route a requires_human_review escalation to the
  # Hrz7 maker-checker console the same way from every producer). Public, pinned by tag, zero-cred.
  "review-kit @ git+https://github.com/portable-genai/review-kit@v0.0.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Pinned per mid-2026 research. ADK 2.0 was a breaking release => pin exactly.
gcp = [
  "google-adk==2.3.0",
  "google-genai>=1.21",
  "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.158.0",
  "google-cloud-bigquery>=3.25",
  "google-cloud-logging>=3.11",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",
  "a2a-sdk>=0.2",
  "mcp>=1.2",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  # Pinned exactly: ruff's formatter output changes between releases, so an unpinned
  # version drifts from CI and fails `ruff format --check`. Bump deliberately.
  "ruff==0.15.18",
  "mypy>=1.10",
  "types-PyYAML",
  "respx>=0.21",
]

[project.scripts]
mkt-perf = "performance_marketing.cli.main:app"

# Required for the commons git+https pins (direct references).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/performance_marketing"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Presentation/demo scripts embed long HTML/CSS string literals; line length there
# hurts more than it helps. The shipped package (src) and tests stay strict.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live Google Cloud credentials (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
